    <style>body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f7f7f5;color:#111827;font-family:Arial,sans-serif}.card{width:min(100%,620px);padding:56px 34px;border:1px solid #e5e7eb;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(17,24,39,.08)}.brand{color:#27578e;font-size:24px;font-weight:800;letter-spacing:.14em}.mark{margin:24px 0 0;color:#d8dee8;font-size:76px;font-weight:800;line-height:1}h1{margin:22px 0 10px;font-size:28px}p{margin:0 auto;max-width:480px;color:#64748b;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:#111827;color:#fff;font-size:14px;font-weight:700;text-decoration:none}a.secondary{border:1px solid #dbe2ea;background:#fff;color:#334155}small{display:block;margin-top:22px;color:#94a3b8}</style>
