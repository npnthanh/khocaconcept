<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Không thể hoàn tất yêu cầu · KHO - CA</title>
    <style>
        :root { font-family: Inter, Arial, sans-serif; color: #111827; background: #f7f7f5; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        .card { width: min(100%, 620px); padding: 56px 34px; border: 1px solid #e5e7eb; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(17,24,39,.08); text-align: center; }
        .brand { margin-bottom: 24px; color: #27578e; font-size: 24px; font-weight: 800; letter-spacing: .14em; }
        .mark { margin: 0; color: #d8dee8; font-size: 76px; font-weight: 800; line-height: 1; }
        h1 { margin: 22px 0 10px; font-size: 28px; }
        p { margin: 0 auto; max-width: 480px; color: #64748b; line-height: 1.7; }
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; color: #fff; background: #111827; font-size: 14px; font-weight: 700; text-decoration: none; }
        a.secondary { color: #334155; border: 1px solid #dbe2ea; background: #fff; }
        small { display: block; margin-top: 22px; color: #94a3b8; }
    </style>
</head>
<body>
    <main class="card" role="alert">
        <div class="brand">KHO - CA</div>
        <p class="mark">!</p>
        <h1>Không thể hoàn tất yêu cầu</h1>
        <p>Máy chủ chưa thể xử lý thao tác này. Nếu bạn đang tải ảnh lên, hãy nén ảnh xuống rồi thử lại.</p>
        <div class="actions">
            <a href="javascript:history.back()">Quay lại</a>
            <a class="secondary" href="/">Về trang chủ</a>
        </div>
        <small>Nếu lỗi tiếp tục xảy ra, vui lòng liên hệ quản trị viên.</small>
    </main>
</body>
</html>
